# Parser + HTTPS (Caddy) pe un VM Oracle. Rulează din acest director: `docker compose up -d --build`
services:
  parser:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: "8000"
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - parser
    ports:
      - "80:80"
      - "443:443"
    environment:
      PARSER_DOMAIN: ${PARSER_DOMAIN:?setează PARSER_DOMAIN în .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
